spring.application.name=ai-job-portal
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/job_portal;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT — override JWT_SECRET in production (min 32 chars)
jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ORIGIN:http://localhost:5173,https://java-job-portal.vercel.app}
app.auth.verification-token-hours=24
app.auth.reset-token-hours=1
# Set false in production — exposes tokens in API responses for local testing without SMTP
app.dev-expose-tokens=${DEV_EXPOSE_TOKENS:true}

app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Demo seed (admin/seeker/recruiter @aijobportal.local / SeedPass1!) — only when DB has no users
app.seed=${APP_SEED:true}

server.port=${PORT:8080}
